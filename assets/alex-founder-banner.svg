      <path d="M2 191H195" stroke="#F0BF24" stroke-width="2" stroke-linecap="round" opacity="0.58"/>

      <text x="2" y="248" fill="#FFFFFF" font-family="Georgia,'Times New Roman',serif" font-size="34" font-style="italic">Diagnose the gap.</text>
      <text x="300" y="248" fill="#FFFFFF" font-family="Georgia,'Times New Roman',serif" font-size="34" font-style="italic">Map the foundation.</text>
      <text x="635" y="248" fill="#F0BF24" font-family="Georgia,'Times New Roman',serif" font-size="34" font-style="italic">Build the path.</text>

