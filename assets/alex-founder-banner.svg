          <text x="275" y="322" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="750" letter-spacing="1.8">PERSONALIZED PATH</text>
          <text x="275" y="340" text-anchor="middle" fill="#F0BF24" font-size="10" font-weight="650">traceable next actions</text>
