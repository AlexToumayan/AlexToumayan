      <text x="0" y="91" fill="#FFFFFF" font-family="Georgia,'Times New Roman',serif" font-size="74" font-weight="700" letter-spacing="-1.4">Alex A. Toumayan</text>
      <text x="2" y="142" fill="#DCE7F7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="29" font-weight="550">Founder, Foundations to Mastery</text>

