      <path d="M0 52H1600M0 104H1600M0 156H1600M0 208H1600M0 260H1600M0 312H1600M0 364H1600M0 416H1600M0 468H1600"/>
      <path d="M52 0V520M104 0V520M156 0V520M208 0V520M260 0V520M312 0V520M364 0V520M416 0V520M468 0V520M520 0V520M572 0V520M624 0V520M676 0V520M728 0V520M780 0V520M832 0V520M884 0V520M936 0V520M988 0V520M1040 0V520M1092 0V520M1144 0V520M1196 0V520M1248 0V520M1300 0V520M1352 0V520M1404 0V520M1456 0V520M1508 0V520M1560 0V520"/>
    </g>

    <rect x="0" width="15" height="520" fill="#F0BF24"/>
    <rect x="15" width="4" height="520" fill="#D79A16" opacity="0.6"/>

    <g transform="translate(82 67)">
