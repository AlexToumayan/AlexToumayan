<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Alex A. Toumayan — Founder of Foundations to Mastery</title>
  <desc id="desc">A navy and gold profile banner showing a learning graph and the phrase Diagnose the gap. Map the foundation. Build the path.</desc>
  <defs>
