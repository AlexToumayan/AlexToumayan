          <rect width="205" height="39" rx="19.5" fill="#FFFFFF" fill-opacity="0.075" stroke="#B9CCE7" stroke-opacity="0.42"/>
          <text x="102.5" y="25" text-anchor="middle" fill="#E2ECFA">LEARNING PATHS</text>
