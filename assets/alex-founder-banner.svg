      <text x="275" y="38" text-anchor="middle" fill="#B9CCE7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.8">FROM EVIDENCE TO ACTION</text>

      <g fill="none" stroke-linecap="round">
        <path d="M275 94L115 185M275 94L275 185M275 94L435 185" stroke="#D6E2F4" stroke-width="2.2" stroke-opacity="0.56"/>
        <path d="M115 229L275 304M275 229V304M435 229L275 304" stroke="#D6E2F4" stroke-width="2.2" stroke-opacity="0.56"/>
        <path d="M275 349V387" stroke="#F0BF24" stroke-width="4"/>
      </g>

      <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
        <g>
