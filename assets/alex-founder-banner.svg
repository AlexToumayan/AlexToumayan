          <text x="275" y="78" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="750" letter-spacing="1.5">LEARNER</text>
          <text x="275" y="96" text-anchor="middle" fill="#F0BF24" font-size="10" font-weight="700" letter-spacing="1.2">CONTEXT</text>
        </g>

        <g>
          <rect x="43" y="181" width="144" height="52" rx="14" fill="#0D2A66" stroke="#AFC5E4" stroke-opacity="0.72"/>
          <text x="115" y="203" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="750" letter-spacing="1.4">EVIDENCE</text>
          <text x="115" y="220" text-anchor="middle" fill="#AFC5E4" font-size="10">what is known</text>
        </g>
        <g>
          <rect x="203" y="181" width="144" height="52" rx="14" fill="#0D2A66" stroke="#AFC5E4" stroke-opacity="0.72"/>
          <text x="275" y="203" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="750" letter-spacing="1.4">FOUNDATION</text>
          <text x="275" y="220" text-anchor="middle" fill="#AFC5E4" font-size="10">where it breaks</text>
        </g>
        <g>
