<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Alex A. Toumayan — Founder of Foundations to Mastery</title>
  <desc id="desc">A navy and gold founder banner with an evidence-to-mastery learning system diagram and the phrase Diagnose the gap. Map the foundation. Build the path.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06152F"/>
      <stop offset="0.58" stop-color="#0B285F"/>
      <stop offset="1" stop-color="#123B79"/>
    </linearGradient>
    <radialGradient id="halo" cx="82%" cy="42%" r="58%">
      <stop offset="0" stop-color="#4D77B7" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#4D77B7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1600" height="520" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
