          <text x="435" y="203" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="750" letter-spacing="1.4">CURRICULUM</text>
          <text x="435" y="220" text-anchor="middle" fill="#AFC5E4" font-size="10">what comes next</text>
        </g>

