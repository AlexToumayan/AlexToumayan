          <rect width="148" height="39" rx="19.5" fill="#FFFFFF" fill-opacity="0.075" stroke="#B9CCE7" stroke-opacity="0.42"/>
          <text x="74" y="25" text-anchor="middle" fill="#E2ECFA">DIAGNOSTICS</text>
        </g>
        <g transform="translate(164 0)">
          <rect width="157" height="39" rx="19.5" fill="#FFFFFF" fill-opacity="0.075" stroke="#B9CCE7" stroke-opacity="0.42"/>
          <text x="78.5" y="25" text-anchor="middle" fill="#E2ECFA">CURRICULUM</text>
        </g>
