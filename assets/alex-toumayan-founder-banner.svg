<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title description">
  <title id="title">Alex A. Toumayan — Founder of Foundations to Mastery</title>
  <desc id="description">A navy and gold banner reading Diagnose the gap. Map the foundation. Build the path, with a connected evidence graph.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061631"/>
      <stop offset="0.58" stop-color="#0D2A66"/>
      <stop offset="1" stop-color="#123A7B"/>
    </linearGradient>
    <radialGradient id="halo" cx="78%" cy="45%" r="55%">
      <stop offset="0" stop-color="#3968AA" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3968AA" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020815" flood-opacity="0.28"/>
    </filter>
    <clipPath id="rounded-frame">
      <rect width="1600" height="500" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded-frame)">
    <rect width="1600" height="500" fill="url(#background)"/>
    <rect width="1600" height="500" fill="url(#halo)"/>

    <g opacity="0.065" stroke="#FFFFFF" stroke-width="1">
      <path d="M0 60H1600M0 120H1600M0 180H1600M0 240H1600M0 300H1600M0 360H1600M0 420H1600M0 480H1600"/>
      <path d="M60 0V500M120 0V500M180 0V500M240 0V500M300 0V500M360 0V500M420 0V500M480 0V500M540 0V500M600 0V500M660 0V500M720 0V500M780 0V500M840 0V500M900 0V500M960 0V500M1020 0V500M1080 0V500M1140 0V500M1200 0V500M1260 0V500M1320 0V500M1380 0V500M1440 0V500M1500 0V500M1560 0V500"/>
    </g>

    <rect x="0" y="0" width="16" height="500" fill="#F0BF24"/>
    <rect x="16" y="0" width="4" height="500" fill="#D99416" opacity="0.62"/>

    <g transform="translate(86 68)">
      <text x="0" y="0" fill="#F0BF24"
            font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
            font-size="20" font-weight="750" letter-spacing="4.2">FOUNDER · EDUCATION SYSTEMS · PRODUCT</text>

      <text x="0" y="96" fill="#FFFFFF"
            font-family="Georgia,'Times New Roman',serif"
            font-size="78" font-weight="700" letter-spacing="-1.6">Alex A. Toumayan</text>

      <text x="2" y="151" fill="#D9E3F1"
            font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
            font-size="30" font-weight="520">Founder, Foundations to Mastery</text>

      <path d="M2 193H780" stroke="#F0BF24" stroke-width="3" stroke-linecap="round"/>
      <path d="M2 204H220" stroke="#F0BF24" stroke-width="2" stroke-linecap="round" opacity="0.52"/>

      <text x="2" y="263" fill="#FFFFFF"
            font-family="Georgia,'Times New Roman',serif"
            font-size="31" font-style="italic">Diagnose the gap.</text>
      <text x="275" y="263" fill="#FFFFFF"
            font-family="Georgia,'Times New Roman',serif"
            font-size="31" font-style="italic">Map the foundation.</text>
      <text x="600" y="263" fill="#F0BF24"
            font-family="Georgia,'Times New Roman',serif"
            font-size="31" font-style="italic">Build the path.</text>

      <g transform="translate(2 315)"
         font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
         font-size="15" font-weight="700" letter-spacing="1.25">
        <g>
          <rect width="150" height="39" rx="19.5" fill="#FFFFFF" fill-opacity="0.07" stroke="#B9C9DF" stroke-opacity="0.48"/>
          <text x="75" y="25.5" text-anchor="middle" fill="#E2EAF5">DIAGNOSTICS</text>
        </g>
        <g transform="translate(166 0)">
          <rect width="158" height="39" rx="19.5" fill="#FFFFFF" fill-opacity="0.07" stroke="#B9C9DF" stroke-opacity="0.48"/>
          <text x="79" y="25.5" text-anchor="middle" fill="#E2EAF5">CURRICULUM</text>
        </g>
        <g transform="translate(340 0)">
          <rect width="203" height="39" rx="19.5" fill="#FFFFFF" fill-opacity="0.07" stroke="#B9C9DF" stroke-opacity="0.48"/>
          <text x="101.5" y="25.5" text-anchor="middle" fill="#E2EAF5">LEARNING PATHS</text>
        </g>
        <g transform="translate(559 0)">
          <rect width="240" height="39" rx="19.5" fill="#FFFFFF" fill-opacity="0.07" stroke="#B9C9DF" stroke-opacity="0.48"/>
          <text x="120" y="25.5" text-anchor="middle" fill="#E2EAF5">EDUCATOR-REVIEWED AI</text>
        </g>
      </g>
    </g>

    <path d="M960 44V456" stroke="#D7DEE8" stroke-opacity="0.18"/>

    <g transform="translate(1012 20)" filter="url(#soft-shadow)">
      <g fill="none" stroke-linecap="round">
        <path d="M92 327L212 241L282 376" stroke="#F0BF24" stroke-width="4"/>
        <path d="M212 241L210 84M212 241L359 90M212 241L444 235M210 84L359 90M359 90L444 235M282 376L444 235"
              stroke="#B9C9DF" stroke-width="2.2" stroke-opacity="0.48"/>
        <path d="M92 327L46 213M92 327L372 329M46 213L210 84M372 329L444 235"
              stroke="#B9C9DF" stroke-width="1.8" stroke-opacity="0.32" stroke-dasharray="7 9"/>
      </g>

      <g fill="#0D2A66" stroke="#D9E3F1" stroke-width="2.2">
        <circle cx="210" cy="84" r="18"/>
        <circle cx="359" cy="90" r="15"/>
        <circle cx="46" cy="213" r="13"/>
        <circle cx="92" cy="327" r="18"/>
        <circle cx="444" cy="235" r="17"/>
        <circle cx="372" cy="329" r="13"/>
      </g>
      <g fill="#F0BF24" stroke="#FFF2B5" stroke-width="3">
        <circle cx="212" cy="241" r="23"/>
        <circle cx="282" cy="376" r="25"/>
      </g>

      <g fill="#FFFFFF"
         font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
         font-size="17" font-weight="750" letter-spacing="1.8">
        <text x="210" y="39" text-anchor="middle">EVIDENCE</text>
        <text x="52" y="178" text-anchor="middle">DIAGNOSE</text>
        <text x="453" y="200" text-anchor="middle">PATH</text>
        <text x="282" y="438" text-anchor="middle" font-size="19">FOUNDATION</text>
      </g>

      <text x="282" y="466" text-anchor="middle" fill="#B9C9DF"
            font-family="Georgia,'Times New Roman',serif"
            font-size="17" font-style="italic">Every conclusion should have a trace.</text>
    </g>
  </g>
</svg>
