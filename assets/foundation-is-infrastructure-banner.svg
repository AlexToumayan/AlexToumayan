<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Alex A. Toumayan — Founder of Foundations to Mastery</title>
  <desc id="desc">Navy and gold profile banner with a prerequisite graph and the phrase Diagnose the gap. Map the foundation. Build the path.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071832"/>
      <stop offset="0.55" stop-color="#0D2A66"/>
      <stop offset="1" stop-color="#153D7B"/>
    </linearGradient>
    <radialGradient id="halo" cx="77%" cy="42%" r="55%">
      <stop offset="0" stop-color="#4D78B6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0D2A66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7D75D"/>
      <stop offset="0.5" stop-color="#F0BF24"/>
      <stop offset="1" stop-color="#D99812"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#020812" flood-opacity="0.35"/>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="1600" height="500" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1600" height="500" fill="url(#background)"/>
    <rect width="1600" height="500" fill="url(#halo)"/>

    <g stroke="#D7DEE8" stroke-width="1" opacity="0.065">
      <path d="M0 50H1600M0 100H1600M0 150H1600M0 200H1600M0 250H1600M0 300H1600M0 350H1600M0 400H1600M0 450H1600"/>
      <path d="M50 0V500M100 0V500M150 0V500M200 0V500M250 0V500M300 0V500M350 0V500M400 0V500M450 0V500M500 0V500M550 0V500M600 0V500M650 0V500M700 0V500M750 0V500M800 0V500M850 0V500M900 0V500M950 0V500M1000 0V500M1050 0V500M1100 0V500M1150 0V500M1200 0V500M1250 0V500M1300 0V500M1350 0V500M1400 0V500M1450 0V500M1500 0V500M1550 0V500"/>
    </g>

    <rect width="15" height="500" fill="url(#gold)"/>
    <rect x="15" width="4" height="500" fill="#FFF3BA" opacity="0.26"/>

    <g transform="translate(82,66)">
      <text x="0" y="0" fill="#F0BF24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3.5">FOUNDER · EDUCATION SYSTEMS · PRODUCT ENGINEERING</text>

      <text x="0" y="91" fill="#FFFFFF" font-family="Georgia,'Times New Roman',serif" font-size="74" font-weight="700" letter-spacing="-1.2">Alex A. Toumayan</text>
      <text x="2" y="141" fill="#D7E2F2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="29" font-weight="500">Founder, Foundations to Mastery</text>

      <path d="M2 180H760" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
      <path d="M2 191H205" stroke="#F0BF24" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

      <text x="2" y="246" fill="#FFFFFF" font-family="Georgia,'Times New Roman',serif" font-size="32" font-style="italic">Diagnose the gap.</text>
      <text x="298" y="246" fill="#FFFFFF" font-family="Georgia,'Times New Roman',serif" font-size="32" font-style="italic">Map the foundation.</text>
      <text x="626" y="246" fill="#F0BF24" font-family="Georgia,'Times New Roman',serif" font-size="32" font-style="italic">Build the path.</text>

      <g transform="translate(2,300)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.1">
        <g>
          <rect width="150" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.07" stroke="#C5D6ED" stroke-opacity="0.42"/>
          <text x="75" y="25" fill="#E5EDF8" text-anchor="middle">DIAGNOSTICS</text>
        </g>
        <g transform="translate(166,0)">
          <rect width="158" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.07" stroke="#C5D6ED" stroke-opacity="0.42"/>
          <text x="79" y="25" fill="#E5EDF8" text-anchor="middle">CURRICULUM</text>
        </g>
        <g transform="translate(340,0)">
          <rect width="205" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.07" stroke="#C5D6ED" stroke-opacity="0.42"/>
          <text x="102.5" y="25" fill="#E5EDF8" text-anchor="middle">LEARNING PATHS</text>
        </g>
        <g transform="translate(561,0)">
          <rect width="246" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.07" stroke="#C5D6ED" stroke-opacity="0.42"/>
          <text x="123" y="25" fill="#E5EDF8" text-anchor="middle">AI + EDUCATOR REVIEW</text>
        </g>
      </g>
    </g>

    <path d="M947 42V458" stroke="#D7DEE8" stroke-opacity="0.18"/>

    <g transform="translate(985,35)" filter="url(#softShadow)">
      <path d="M280 390C197 357 143 308 129 244C116 184 143 127 209 82" fill="none" stroke="#F0BF24" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
      <path d="M280 390C365 360 420 309 431 243C441 182 408 125 345 80" fill="none" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="8 10" opacity="0.36"/>

      <g fill="none" stroke="#B6CBE6" stroke-width="2" opacity="0.38">
        <path d="M209 82L345 80"/>
        <path d="M209 82L129 244"/>
        <path d="M209 82L224 254"/>
        <path d="M345 80L224 254"/>
        <path d="M345 80L431 243"/>
        <path d="M129 244L224 254"/>
        <path d="M224 254L431 243"/>
        <path d="M129 244L76 333"/>
        <path d="M224 254L76 333"/>
        <path d="M224 254L355 321"/>
        <path d="M431 243L355 321"/>
        <path d="M76 333L280 390"/>
        <path d="M355 321L280 390"/>
        <path d="M224 254L280 390"/>
      </g>

      <g fill="#0D2A66" stroke="#D7E2F2" stroke-width="2">
        <circle cx="209" cy="82" r="18"/>
        <circle cx="345" cy="80" r="15"/>
        <circle cx="129" cy="244" r="17"/>
        <circle cx="224" cy="254" r="22"/>
        <circle cx="431" cy="243" r="16"/>
        <circle cx="76" cy="333" r="13"/>
        <circle cx="355" cy="321" r="14"/>
      </g>
      <g fill="#F0BF24" stroke="#FFF2AC" stroke-width="3" filter="url(#nodeGlow)">
        <circle cx="224" cy="254" r="9"/>
        <circle cx="280" cy="390" r="24"/>
      </g>

      <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="750" fill="#FFFFFF" text-anchor="middle">
        <text x="209" y="38" font-size="17" letter-spacing="2">EVIDENCE</text>
        <text x="129" y="209" font-size="16" letter-spacing="1.6">MAP</text>
        <text x="431" y="208" font-size="16" letter-spacing="1.6">PATH</text>
        <text x="280" y="452" font-size="18" letter-spacing="2">FOUNDATION</text>
      </g>
    </g>
  </g>
</svg>
